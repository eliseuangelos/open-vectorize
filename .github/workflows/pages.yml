name: Build and deploy AngelosOpenVectorize

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Rust e alvo WebAssembly
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Instalar wasm-pack
        run: cargo install wasm-pack --locked

      - name: Validar JavaScript e testes
        run: |
          npm test
          npm run check

      - name: Compilar VTracer para WebAssembly
        run: npm run build:wasm

      - name: Verificar que o motor WASM foi realmente produzido
        run: |
          test -s js/wasm/pkg/angelos_open_vectorize_wasm.js
          test -s js/wasm/pkg/angelos_open_vectorize_wasm_bg.wasm
          test "$(head -c 4 js/wasm/pkg/angelos_open_vectorize_wasm_bg.wasm | od -An -tx1 | tr -d ' \n')" = "0061736d"

      - name: Preparar arquivos estáticos
        run: npm run build:site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
