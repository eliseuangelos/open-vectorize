[package]
name = "angelos-open-vectorize-wasm"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Browser WebAssembly adapter for VTracer used by AngelosOpenVectorize"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1.0"
vtracer = { version = "=1.0.0-alpha.4", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true


# O binario gerado pelo rustc usa recursos WebAssembly modernos (bulk memory e
# non-trapping float-to-int). O wasm-opt distribuído pelo wasm-pack nesta CI
# valida esses recursos com defaults incompatíveis e falha antes do empacotamento.
# Desativar somente a otimização opcional mantém o WASM funcional e compatível
# com navegadores modernos, permitindo que wasm-bindgen conclua o pacote.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
