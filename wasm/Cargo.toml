[package]
name = "angelos-open-vectorize-wasm"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Browser WebAssembly adapter for VTracer used by AngelosOpenVectorize"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1.0"
vtracer = { version = "=1.0.0-alpha.4", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
